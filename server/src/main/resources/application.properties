# Server configuration
server.port=8080
server.servlet.context-path=/api

# Spring profiles
spring.profiles.active=dev

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/vibe
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ActiveMQ configuration
spring.activemq.broker-url=vm://embedded?broker.persistent=false
spring.activemq.in-memory=true
spring.activemq.pool.enabled=false

# File storage configuration
# AWS S3 (used in prod profile)
aws.s3.bucket-name=vibe-storage
aws.s3.region=us-east-1
aws.s3.access-key=dummy-access-key
aws.s3.secret-key=dummy-secret-key

# Local storage (used in dev profile)
local.storage.path=./file-storage

# JWT configuration
jwt.secret=verySecretKeyThatShouldBeChangedInProduction
jwt.expiration=86400000

# Swagger configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true